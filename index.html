<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Trivia Sally Face</title>

</head>

<div id="inicio" class="pantalla fondoInicio">

</div>

<button onclick="comenzarPreguntas()">Continuar</button>

</div>

</div>
<div id="preguntas" class="pantalla fondoPreguntas" style="display:none;"><div class="caja">

<div class="barra">

</div>
<h2 id="pregunta"></h2>

<div id="opciones"></div>

</div>
</div>


<div id="resultado" class="pantalla fondoResultado" style="display:none;">

</div>
</div>

</html>
